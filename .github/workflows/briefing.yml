name: Morning Brief

on:
  schedule:
    - cron: '0 14 * * *'  # 7am PDT (UTC-7)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-briefing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run briefing
        env:
          GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}
        run: python briefing.py

      - name: Publish page
        run: |
          git config user.name "Morning Brief"
          git config user.email "action@github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Daily brief $(date +%Y-%m-%d)"
          git push
