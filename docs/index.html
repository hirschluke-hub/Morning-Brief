<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morning Brief</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
      min-height: 100vh;
    }

    /* ── Hero ── */
    .hero {
      position: relative;
      width: 100%;
      height: 55vh;
      min-height: 320px;
      background: url('https://images.unsplash.com/photo-1418985991508-e47386d96a71?w=1400&q=85') center/cover no-repeat;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.35) 0%,
        rgba(0,0,0,0.15) 40%,
        rgba(0,0,0,0.75) 100%
      );
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 32px 32px;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .greeting {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    .weather-badge {
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      text-align: right;
    }

    .hero-bottom { }

    .date-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 8px;
    }

    .hero-quote {
      font-size: 17px;
      font-style: italic;
      color: rgba(255,255,255,0.9);
      line-height: 1.55;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      max-width: 520px;
    }

    .hero-author {
      margin-top: 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    /* ── Content ── */
    .content {
      max-width: 860px;
      margin: 0 auto;
      padding: 36px 32px 64px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    @media (max-width: 600px) {
      .content { grid-template-columns: 1fr; gap: 32px; padding: 28px 20px 56px; }
    }

    .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: #3a3a3a;
      margin-bottom: 16px;
    }

    .event {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #1a1a1a;
    }

    .event:last-child { border-bottom: none; }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }

    .event-name {
      font-size: 15px;
      font-weight: 500;
      color: #ddd;
      line-height: 1.3;
    }

    .event-time {
      font-size: 12px;
      color: #484848;
      margin-top: 3px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #1a1a1a;
      color: #333;
      font-size: 15px;
    }

    .todo-item:last-child { border-bottom: none; }

    .circle {
      width: 17px;
      height: 17px;
      border: 1.5px solid #2a2a2a;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .empty { color: #383838; font-size: 14px; padding: 8px 0; }

    .weather-strip {
      background: #111;
      border-bottom: 1px solid #1c1c1c;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .weather-temp-big {
      font-size: 52px;
      font-weight: 200;
      color: #f0f0f0;
      line-height: 1;
    }

    .weather-right {}

    .weather-condition {
      font-size: 16px;
      color: #aaa;
      font-weight: 400;
    }

    .weather-location {
      font-size: 12px;
      color: #3a3a3a;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .bottom {
      text-align: center;
      padding: 0 32px 56px;
      font-size: 13px;
      color: #2e2e2e;
      font-style: italic;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="hero-overlay">
      <div class="hero-top">
        <div class="greeting">Good morning, Luke.</div>
      </div>
      <div class="hero-bottom">
        <div class="date-label">Monday, May 4, 2026</div>
        <div class="hero-quote">"It always seems impossible until it's done."</div>
        <div class="hero-author">— Nelson Mandela</div>
      </div>
    </div>
  </div>

  <div class="weather-strip">
    <div class="weather-temp-big">62°</div>
    <div class="weather-right">
      <div class="weather-condition">Overcast</div>
      <div class="weather-location">San Diego, CA</div>
    </div>
  </div>

  <div class="content">
    <div>
      <div class="label">Today's Schedule</div>
      
          <div class="event">
            <div class="dot" style="background:#b39ddb"></div>
            <div class="event-info">
              <div class="event-name">Interwest Capital Internship</div>
              <div class="event-time">10am–2pm</div>
            </div>
          </div>
          <div class="event">
            <div class="dot" style="background:#81c784"></div>
            <div class="event-info">
              <div class="event-name">Valuations Class</div>
              <div class="event-time">4pm–6pm</div>
            </div>
          </div>
    </div>
    <div>
      <div class="label">To-Do</div>
      <div class="todo-item"><div class="circle"></div> —</div>
      <div class="todo-item"><div class="circle"></div> —</div>
      <div class="todo-item"><div class="circle"></div> —</div>
    </div>
  </div>

  <div class="bottom">You're building the life you dreamed of. Keep going.</div>

</body>
</html>
