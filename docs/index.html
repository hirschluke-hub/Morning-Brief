<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morning Brief</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
      min-height: 100vh;
      padding: 52px 24px 72px;
      max-width: 480px;
      margin: 0 auto;
    }

    .date {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: #484848;
      margin-bottom: 10px;
    }

    .greeting {
      font-size: 32px;
      font-weight: 600;
      color: #f2f2f2;
      margin-bottom: 40px;
      line-height: 1.2;
    }

    .weather {
      display: flex;
      align-items: center;
      gap: 18px;
      background: #161616;
      border-radius: 16px;
      padding: 20px 22px;
      margin-bottom: 20px;
    }

    .temp {
      font-size: 40px;
      font-weight: 300;
      color: #f0f0f0;
    }

    .weather-desc {
      font-size: 15px;
      color: #aaa;
    }

    .weather-loc {
      font-size: 12px;
      color: #484848;
      margin-top: 3px;
    }

    .quote {
      border-left: 2px solid #222;
      padding: 12px 18px;
      margin-bottom: 40px;
      color: #585858;
      font-size: 14px;
      line-height: 1.75;
      font-style: italic;
    }

    .quote-author {
      margin-top: 8px;
      font-style: normal;
      font-size: 12px;
      color: #3a3a3a;
    }

    .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: #383838;
      margin-bottom: 14px;
    }

    .events { margin-bottom: 40px; }

    .event {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #161616;
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .event-info { flex: 1; }

    .event-name {
      font-size: 15px;
      font-weight: 500;
      color: #e0e0e0;
    }

    .event-cat {
      font-size: 11px;
      color: #484848;
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .event-time {
      font-size: 13px;
      color: #484848;
      white-space: nowrap;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid #161616;
      color: #383838;
      font-size: 15px;
    }

    .todo-item:last-child { border-bottom: none; }

    .circle {
      width: 18px;
      height: 18px;
      border: 1.5px solid #242424;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .empty {
      color: #383838;
      font-size: 14px;
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <div class="date">Monday, May 4, 2026</div>
  <div class="greeting">Good morning, Luke.</div>

  
  <div class="weather">
    <div class="temp">63°</div>
    <div>
      <div class="weather-desc">Overcast</div>
      <div class="weather-loc">San Diego, CA</div>
    </div>
  </div>

  <div class="quote">
    It always seems impossible until it's done.
    <div class="quote-author">— Nelson Mandela</div>
  </div>

  <div class="events">
    <div class="label">Today</div>
    
    <div class="event">
      <div class="dot" style="background:#b39ddb"></div>
      <div class="event-info">
        <div class="event-name">Interwest Capital Internship</div>
        <div class="event-cat">Work</div>
      </div>
      <div class="event-time">10am–2pm</div>
    </div>
    <div class="event">
      <div class="dot" style="background:#81c784"></div>
      <div class="event-info">
        <div class="event-name">Valuations Class</div>
        <div class="event-cat">School</div>
      </div>
      <div class="event-time">4pm–6pm</div>
    </div>
  </div>

  <div>
    <div class="label">To-do</div>
    <div class="todo-item"><div class="circle"></div>—</div>
    <div class="todo-item"><div class="circle"></div>—</div>
    <div class="todo-item"><div class="circle"></div>—</div>
  </div>
</body>
</html>
